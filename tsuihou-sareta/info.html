<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Anime - Nama Anime</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .poster {
            text-align: center;
        }
        .poster img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .info {
            margin-top: 20px;
        }
        .info h1 {
            margin-top: 0;
        }
        .episode-list {
            margin-top: 20px;
        }
        .episode-list ul {
            list-style: none;
            padding: 0;
        }
        .episode-list li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .episode-list li a {
            text-decoration: none;
            color: #007bff;
        }
        .episode-list li a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="poster">
            <!-- Ganti src dengan URL poster anime -->
            <img src="https://via.placeholder.com/300x450/cccccc/666666?text=Poster+Anime" alt="Poster Anime">
        </div>
        <div class="info">
            <h1>Nama Anime</h1>
            <p><strong>Sinopsis:</strong> Ini adalah sinopsis singkat dari anime. Anda bisa menggantinya dengan sinopsis yang sebenarnya.</p>
            <p><strong>Genre:</strong> Aksi, Petualangan, Komedi</p>
            <p><strong>Total Episode:</strong> 1</p>
        </div>
        <div class="episode-list">
            <h2>Daftar Episode</h2>
            <ul>
                <li><a href="watch.html?ep=1">Episode 1</a></li>
                <!-- Tambahkan episode lain di sini -->
            </ul>
        </div>
        <a href="index.html" class="back-link">Kembali ke Beranda</a>
    </div>
</body>
</html>
