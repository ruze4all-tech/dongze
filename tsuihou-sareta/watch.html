<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonton Anime</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #222;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .info {
            margin-top: 15px;
            text-align: center;
        }
        .info h2 {
            margin: 0 0 5px 0;
        }
        .info p {
            color: #aaa;
            margin: 0;
        }
        .nav-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            padding: 8px 15px;
            background-color: #333;
            border-radius: 5px;
        }
        .nav-links a:hover {
            background-color: #444;
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .back-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-wrapper">
            <!-- 
                LINK VIDEO OK.RU ANDA:
                Ganti src di bawah ini dengan link embed dari OK.ru.
                Format link embed: https://ok.ru/videoembed/ID_VIDEO
                ID video dari link Anda adalah: 9912202562114
            -->
            <iframe 
                src="https://ok.ru/videoembed/9912202562114" 
                frameborder="0" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
        <div class="info">
            <h2 id="episode-title">Episode 1</h2>
            <p id="episode-desc">Deskripsi singkat episode ini.</p>
        </div>
        <div class="nav-links">
            <a href="#" id="prev-ep">◀ Episode Sebelumnya</a>
            <a href="#" id="next-ep">Episode Selanjutnya ▶</a>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <a href="info.html" class="back-link">Kembali ke Info Anime</a>
        </div>
    </div>

    <script>
        // Fungsi sederhana untuk mengambil parameter URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Ambil nomor episode dari URL (contoh: watch.html?ep=1)
        const episode = getQueryParam('ep') || '1';
        document.getElementById('episode-title').textContent = `Episode ${episode}`;
        document.getElementById('episode-desc').textContent = `Deskripsi untuk Episode ${episode}.`;

        // Catatan: Link OK.ru sudah terpasang di iframe di atas.
        // Untuk mengganti video berdasarkan episode, Anda bisa menggunakan JavaScript
        // untuk mengubah atribut 'src' dari iframe.

        // Contoh logika untuk navigasi episode (opsional):
        // Anda bisa menambahkan daftar link video untuk setiap episode di sini.
        /*
        const episodeLinks = {
            '1': 'https://ok.ru/videoembed/9912202562114',
            '2': 'https://ok.ru/videoembed/ID_EPISODE_2',
        };
        const iframe = document.querySelector('.video-wrapper iframe');
        if (episodeLinks[episode]) {
            iframe.src = episodeLinks[episode];
        }
        */
    </script>
</body>
</html>
