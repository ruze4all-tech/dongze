
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonton - Tsuihou Sareta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        body { background: #0d0d1a; color: #e8e8e8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .video-wrapper { background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; width: 100%; border: 1px solid #2a2a3a; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .watch-info { margin-top: 15px; text-align: center; }
        .watch-info h2 { color: #e8e8e8; font-size: 20px; margin-bottom: 5px; }
        .watch-info p { color: #7a7a9a; font-size: 13px; word-break: break-all; }
        .watch-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 15px; }
        .watch-nav button { background: #4a9eff; color: #fff; border: none; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .watch-nav button:hover { background: #3b7dd8; }
        .watch-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
        .back-btn { background: #4a9eff; color: #fff; border: none; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-size: 14px; margin-bottom: 15px; transition: 0.2s; }
        .back-btn:hover { background: #3b7dd8; }
        .ad-footer { margin-top: 25px; padding: 10px 0; border-top: 1px solid #2a2a3a; }
        .ad-container { min-height: 90px; display: flex; justify-content: center; align-items: center; background: transparent; border-radius: 12px; overflow: hidden; }
        @media (max-width: 768px) {
            .container { padding: 10px 15px; }
            .watch-nav { flex-wrap: wrap; gap: 10px; }
            .watch-nav button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- BACK BUTTON -->
        <button class="back-btn" onclick="location.href='info.html'"><i class="fas fa-arrow-left"></i> Kembali ke Detail</button>

        <!-- VIDEO PLAYER -->
        <div class="video-wrapper">
            <iframe 
                id="videoPlayer"
                src="" 
                width="100%" 
                height="100%" 
                frameborder="0" 
                allowfullscreen
                allow="autoplay; encrypted-media; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
            ></iframe>
        </div>

        <!-- INFO EPISODE -->
        <div class="watch-info">
            <h2 id="watchTitle">Memuat...</h2>
            <p id="watchMeta">Loading...</p>
        </div>

        <!-- NAVIGASI EPISODE (PREV/NEXT) -->
        <div class="watch-nav">
            <button id="prevBtn" onclick="navigateEpisode(-1)"><i class="fas fa-chevron-left"></i> Sebelumnya</button>
            <span id="episodeCounter" style="color:#7a7a9a; font-size:14px;">1 / 1</span>
            <button id="nextBtn" onclick="navigateEpisode(1)">Selanjutnya <i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- IKLAN FOOTER -->
        <div class="ad-footer">
            <div class="ad-container">
                <script>
                    atOptions = {
                        'key' : 'a8d36c10a5a6fd39ae4b31451290d5e4',
                        'format' : 'iframe',
                        'height' : 50,
                        'width' : 320,
                        'params' : {}
                    };
                </script>
                <script src="https://www.highrevenueformat.com/a8d36c10a5a6fd39ae4b31451290d5e4/invoke.js"></script>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  BACA PARAMETER DARI URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const episode = urlParams.get('ep');
        const videoUrl = urlParams.get('url');

        // ============================================================
        //  DATA EPISODE (HARDCODE - TAMBAHKAN SEMUA EPISODE DI SINI)
        // ============================================================
        const episodeList = [
            { number: 7, title: 'Tsuihou Sareta', url: 'https://ok.ru/videoembed/9912202562114' }
            // ★ TAMBAH EPISODE LAIN DI SINI ★
            // { number: 1, title: 'Judul Episode 1', url: 'https://link.com' },
            // { number: 2, title: 'Judul Episode 2', url: 'https://link.com' },
        ];

        let currentIndex = 0;

        // ============================================================
        //  CARI INDEX EPISODE BERDASARKAN PARAMETER
        // ============================================================
        function findEpisodeIndex(epNumber) {
            for (let i = 0; i < episodeList.length; i++) {
                if (episodeList[i].number == epNumber) {
                    return i;
                }
            }
            return 0;
        }

        // ============================================================
        //  LOAD EPISODE
        // ============================================================
        function loadEpisode(index) {
            if (index < 0 || index >= episodeList.length) return;

            const ep = episodeList[index];
            currentIndex = index;

            // Update player
            const iframe = document.getElementById('videoPlayer');
            iframe.src = ep.url;

            // Update info
            document.getElementById('watchTitle').textContent = `Episode ${ep.number} - ${ep.title}`;
            document.getElementById('watchMeta').textContent = `Sumber: ${ep.url}`;

            // Update counter
            document.getElementById('episodeCounter').textContent = `${index + 1} / ${episodeList.length}`;

            // Update tombol navigasi
            document.getElementById('prevBtn').disabled = (index <= 0);
            document.getElementById('nextBtn').disabled = (index >= episodeList.length - 1);

            // Update URL tanpa reload
            const newUrl = `?ep=${ep.number}&url=${encodeURIComponent(ep.url)}`;
            window.history.pushState({ path: newUrl }, '', newUrl);

            console.log('🎬 Memutar Episode:', ep.number, '-', ep.title);
            console.log('📌 Link:', ep.url);
        }

        // ============================================================
        //  NAVIGASI EPISODE (PREV/NEXT)
        // ============================================================
        function navigateEpisode(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex < 0 || newIndex >= episodeList.length) return;
            loadEpisode(newIndex);
        }

        // ============================================================
        //  INISIALISASI
        // ============================================================
        if (episode) {
            const idx = findEpisodeIndex(parseInt(episode));
            loadEpisode(idx);
        } else if (episodeList.length > 0) {
            loadEpisode(0);
        } else {
            document.getElementById('watchTitle').textContent = '⚠️ Belum ada episode';
            document.getElementById('watchMeta').textContent = 'Tambahkan episode di data episodeList.';
        }

        // Support back browser
        window.addEventListener('popstate', function() {
            const params = new URLSearchParams(window.location.search);
            const ep = params.get('ep');
            if (ep) {
                const idx = findEpisodeIndex(parseInt(ep));
                loadEpisode(idx);
            }
        });

        console.log('📋 Total Episode:', episodeList.length);
    </script>
</body>
</html>
