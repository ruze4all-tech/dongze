<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime - Nonton Anime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo"><span class="blue">A</span><span>n</span><span class="green">i</span><span>me</span></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari anime..." onkeyup="searchAnime()">
                <button onclick="searchAnime()"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <nav class="main-nav" id="mainNav">
            <a href="#" class="active" onclick="goHome()"><i class="fas fa-home"></i> Home</a>
            <a href="#" onclick="filterByGenre('all')"><i class="fas fa-list"></i> Daftar Anime</a>
            <a href="#" onclick="filterByGenre('donghua')"><i class="fas fa-dragon"></i> Donghua</a>
            <a href="#" onclick="document.querySelector('.genre-filter').scrollIntoView({behavior:'smooth'})"><i class="fas fa-tags"></i> Genre</a>
            <a href="#" onclick="alert('Jadwal rilis akan segera hadir!')"><i class="fas fa-calendar-alt"></i> Jadwal Rilis</a>
        </nav>
    </header>

    <div class="container">

        <div id="page-home" class="page active">
            <div class="section-title"><i class="fas fa-fire"></i> Update Anime</div>

            <div class="genre-filter">
                <button class="genre-btn active" data-genre="all" onclick="filterByGenre('all')">Semua</button>
                <button class="genre-btn" data-genre="action" onclick="filterByGenre('action')">Action</button>
                <button class="genre-btn" data-genre="adventure" onclick="filterByGenre('adventure')">Adventure</button>
                <button class="genre-btn" data-genre="comedy" onclick="filterByGenre('comedy')">Comedy</button>
                <button class="genre-btn" data-genre="drama" onclick="filterByGenre('drama')">Drama</button>
                <button class="genre-btn" data-genre="fantasy" onclick="filterByGenre('fantasy')">Fantasy</button>
                <button class="genre-btn" data-genre="donghua" onclick="filterByGenre('donghua')">Donghua</button>
                <button class="genre-btn" data-genre="romance" onclick="filterByGenre('romance')">Romance</button>
                <button class="genre-btn" data-genre="shonen" onclick="filterByGenre('shonen')">Shonen</button>
                <button class="genre-btn" data-genre="slice-of-life" onclick="filterByGenre('slice-of-life')">Slice of Life</button>
                <button class="genre-btn" data-genre="wuxia" onclick="filterByGenre('wuxia')">Wuxia</button>
                <button class="genre-btn" data-genre="xianxia" onclick="filterByGenre('xianxia')">Xianxia</button>
                <button class="genre-btn" data-genre="cultivation" onclick="filterByGenre('cultivation')">Cultivation</button>
            </div>

            <!-- ★ DAFTAR ANIME (HARDCODE LANGSUNG) ★ -->
            <div class="anime-grid" id="animeGrid">
                <!-- Kartu Anime 1: Tsuihou Sareta -->
                <div class="anime-card" onclick="location.href='tsuihou-sareta/info.html'">
                    <img src="https://via.placeholder.com/300x400/4a9eff/fff?text=Tsuihou+Sareta" alt="Tsuihou Sareta">
                    <div class="info">
                        <h3>Tsuihou Sareta Tensei Juukishi</h3>
                        <p>Action, Fantasy, Isekai</p>
                    </div>
                </div>

                <!-- Kartu Anime 2: Renegade Immortal -->
                <div class="anime-card" onclick="location.href='renegade-immortal/info.html'">
                    <img src="https://via.placeholder.com/300x400/ff4757/fff?text=Renegade+Immortal" alt="Renegade Immortal">
                    <div class="info">
                        <h3>Renegade Immortal</h3>
                        <p>Action, Adventure, Donghua, Fantasy</p>
                    </div>
                </div>

                <!-- Kartu Anime 3: Otome Game S2 -->
                <div class="anime-card" onclick="location.href='otome-game-s2/info.html'">
                    <img src="https://via.placeholder.com/300x400/ff6b35/fff?text=Otome+Game+S2" alt="Otome Game S2">
                    <div class="info">
                        <h3>Otome Game S2</h3>
                        <p>Comedy, Romance, Isekai</p>
                    </div>
                </div>

                <!-- Kartu Anime 4: Classroom of the Elite -->
                <div class="anime-card" onclick="location.href='youkoso-jitsuryoku/info.html'">
                    <img src="https://via.placeholder.com/300x400/4a9eff/fff?text=Youkoso" alt="Youkoso Jitsuryoku">
                    <div class="info">
                        <h3>Youkoso Jitsuryoku</h3>
                        <p>Psychological, School, Drama</p>
                    </div>
                </div>

                <!-- Tambah kartu anime lain di sini -->
            </div>

            <div class="pagination">
                <button id="prevPageBtn" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i> Sebelumnya</button>
                <span id="pageInfo">Halaman 1 dari 1</span>
                <button id="nextPageBtn" onclick="changePage(1)">Selanjutnya <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div id="globalLoader" class="loader" style="display:none;">
            <i class="fas fa-spinner"></i>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
