<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Nonton Anime & Donghua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="logo"><span>Anime</span>Stream</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari anime atau donghua..." onkeyup="searchAnime()">
            <button onclick="searchAnime()"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- ==================== KONTEN ==================== -->
    <div class="container">

        <!-- ==================== HALAMAN HOME ==================== -->
        <div id="page-home" class="page active">
            <div class="section-title"><i class="fas fa-film"></i> Daftar Anime</div>

            <!-- ★ FILTER GENRE ★ -->
            <div class="genre-filter">
                <button class="genre-btn active" data-genre="all" onclick="filterByGenre('all')">Semua</button>
                <button class="genre-btn" data-genre="action" onclick="filterByGenre('action')">Action</button>
                <button class="genre-btn" data-genre="adventure" onclick="filterByGenre('adventure')">Adventure</button>
                <button class="genre-btn" data-genre="comedy" onclick="filterByGenre('comedy')">Comedy</button>
                <button class="genre-btn" data-genre="drama" onclick="filterByGenre('drama')">Drama</button>
                <button class="genre-btn" data-genre="fantasy" onclick="filterByGenre('fantasy')">Fantasy</button>
                <button class="genre-btn" data-genre="horror" onclick="filterByGenre('horror')">Horror</button>
                <button class="genre-btn" data-genre="mecha" onclick="filterByGenre('mecha')">Mecha</button>
                <button class="genre-btn" data-genre="mystery" onclick="filterByGenre('mystery')">Mystery</button>
                <button class="genre-btn" data-genre="psychological" onclick="filterByGenre('psychological')">Psychological</button>
                <button class="genre-btn" data-genre="romance" onclick="filterByGenre('romance')">Romance</button>
                <button class="genre-btn" data-genre="sci-fi" onclick="filterByGenre('sci-fi')">Sci-Fi</button>
                <button class="genre-btn" data-genre="shonen" onclick="filterByGenre('shonen')">Shonen</button>
                <button class="genre-btn" data-genre="slice-of-life" onclick="filterByGenre('slice-of-life')">Slice of Life</button>
                <button class="genre-btn" data-genre="sports" onclick="filterByGenre('sports')">Sports</button>
                <button class="genre-btn" data-genre="supernatural" onclick="filterByGenre('supernatural')">Supernatural</button>
                <button class="genre-btn" data-genre="thriller" onclick="filterByGenre('thriller')">Thriller</button>
                <button class="genre-btn" data-genre="donghua" onclick="filterByGenre('donghua')">Donghua</button>
                <button class="genre-btn" data-genre="wuxia" onclick="filterByGenre('wuxia')">Wuxia</button>
                <button class="genre-btn" data-genre="xianxia" onclick="filterByGenre('xianxia')">Xianxia</button>
                <button class="genre-btn" data-genre="cultivation" onclick="filterByGenre('cultivation')">Cultivation</button>
                <button class="genre-btn" data-genre="historical" onclick="filterByGenre('historical')">Historical</button>
                <button class="genre-btn" data-genre="martial-arts" onclick="filterByGenre('martial-arts')">Martial Arts</button>
            </div>

            <div id="animeGrid" class="anime-grid"></div>
        </div>

        <!-- ==================== HALAMAN DETAIL ==================== -->
        <div id="page-detail" class="page">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Kembali</button>
            <div id="detailContent"></div>
        </div>

        <!-- ==================== HALAMAN TONTON ==================== -->
        <div id="page-watch" class="page">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Kembali</button>
            <div id="watchContent">
                <div class="video-wrapper">
                    <video id="videoPlayer" controls autoplay></video>
                </div>
                <div class="watch-info">
                    <h2 id="watchTitle">Memuat...</h2>
                    <div class="watch-nav">
                        <button id="prevEpBtn" onclick="navigateEpisode(-1)"><i class="fas fa-chevron-left"></i> Sebelumnya</button>
                        <button id="nextEpBtn" onclick="navigateEpisode(1)">Selanjutnya <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== LOADING ==================== -->
        <div id="globalLoader" class="loader" style="display:none;">
            <i class="fas fa-spinner"></i>
        </div>

    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="script.js"></script>

</body>
</html>
