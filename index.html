<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream - Clone Sederhana</title>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- HLS.js untuk putar video m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <style>
        /* ========== GLOBAL RESET & CSS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b0f19;
            color: #f1f3f5;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Scrollbar Kustom */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141b2b;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff4757;
            border-radius: 10px;
        }

        /* ========== HEADER ========== */
        header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3346;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ff4757;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #f1f3f5;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #1e273a;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #2a3346;
            transition: 0.3s;
        }
        .search-box:focus-within {
            border-color: #ff4757;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.2);
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 5px 10px;
            width: 200px;
            font-size: 14px;
        }
        .search-box input::placeholder {
            color: #7a849b;
        }
        .search-box button {
            background: transparent;
            border: none;
            color: #7a849b;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .search-box button:hover {
            color: #ff4757;
        }

        /* ========== KONTEN UTAMA ========== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 30px;
        }

        /* Sembunyikan halaman secara default */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ========== HOME ========== */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 30px 0 15px 0;
            border-left: 4px solid #ff4757;
            padding-left: 15px;
        }
        .section-title i {
            margin-right: 10px;
            color: #ff4757;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .anime-card {
            background: #141b2b;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #1e273a;
        }
        .anime-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.15);
            border-color: #ff4757;
        }

        .anime-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #0f1422;
            display: block;
        }

        .anime-card .info {
            padding: 12px 15px;
        }
        .anime-card .info h3 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .anime-card .info p {
            font-size: 12px;
            color: #7a849b;
        }
        .anime-card .info .ep-badge {
            background: #ff4757;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-top: 5px;
        }

        /* ========== DETAIL ANIME ========== */
        .detail-banner {
            position: relative;
            background: #0f1422;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #1e273a;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }
        .detail-banner .poster {
            flex: 0 0 220px;
            height: 320px;
        }
        .detail-banner .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-banner .desc {
            flex: 1;
            padding: 25px 30px;
            background: linear-gradient(90deg, #0b0f19 60%, transparent);
        }
        .detail-banner .desc h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .detail-banner .desc .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .detail-banner .desc .genres span {
            background: #1e273a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
        }
        .detail-banner .desc p {
            color: #b0b9ce;
            line-height: 1.7;
            font-size: 14px;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Daftar Episode */
        .episode-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .episode-btn {
            background: #141b2b;
            border: 1px solid #1e273a;
            color: #f1f3f5;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }
        .episode-btn:hover {
            background: #ff4757;
            border-color: #ff4757;
            transform: scale(1.02);
        }

        .back-btn {
            background: transparent;
            border: 1px solid #2a3346;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #1e273a;
        }

        /* ========== HALAMAN TONTON ========== */
        .video-wrapper {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
            border: 1px solid #1e273a;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .watch-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .watch-info h2 {
            font-size: 20px;
        }
        .watch-nav button {
            background: #1e273a;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .watch-nav button:hover:not(:disabled) {
            background: #ff4757;
        }
        .watch-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== LOADING ========== */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
        }
        .loader i {
            font-size: 40px;
            color: #ff4757;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .search-box input {
                width: 140px;
            }
            .detail-banner .poster {
                flex: 0 0 100%;
                height: 220px;
            }
            .detail-banner .desc {
                padding: 15px;
            }
            .detail-banner .desc h1 {
                font-size: 22px;
            }
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
            .episode-list {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            .container {
                padding: 10px 15px;
            }
        }

        /* Status kosong / error */
        .empty-state {
            text-align: center;
            padding: 50px 0;
            color: #7a849b;
        }
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #2a3346;
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="logo"><span>Anime</span>Stream</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari anime..." onkeydown="if(event.key==='Enter') searchAnime()">
            <button onclick="searchAnime()"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- ==================== KONTEN ==================== -->
    <div class="container">

        <!-- HALAMAN HOME -->
        <div id="page-home" class="page active">
            <div class="section-title"><i class="fas fa-fire"></i> Trending Sekarang</div>
            <div id="trendingGrid" class="anime-grid"></div>

            <div class="section-title"><i class="fas fa-clock"></i> Episode Terbaru</div>
            <div id="recentGrid" class="anime-grid"></div>
        </div>

        <!-- HALAMAN DETAIL -->
        <div id="page-detail" class="page">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Kembali</button>
            <div id="detailContent"></div>
        </div>

        <!-- HALAMAN TONTON -->
        <div id="page-watch" class="page">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</button>
            <div id="watchContent">
                <div class="video-wrapper">
                    <video id="videoPlayer" controls autoplay></video>
                </div>
                <div class="watch-info">
                    <h2 id="watchTitle">Memuat...</h2>
                    <div class="watch-nav">
                        <button id="prevEpBtn" onclick="navigateEpisode(-1)"><i class="fas fa-chevron-left"></i> Sebelumnya</button>
                        <button id="nextEpBtn" onclick="navigateEpisode(1)">Selanjutnya <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Global -->
        <div id="globalLoader" class="loader" style="display:none;">
            <i class="fas fa-spinner"></i>
        </div>

    </div>

    <script>
        // ============================================================
        //  KONFIGURASI & STATE
        // ============================================================
        const API_BASE = 'https://api.conumet.org'; // BASE API
        // Karena API consumet terkadang memiliki CORS issue, kita pakai proxy publik jika perlu.
        // Tapi endpoint standar biasanya allow CORS. Kita pakai langsung.
        // Jika bermasalah, ganti ke: 'https://corsproxy.io/?' + encodeURIComponent(API_BASE + path)
        // Untuk keandalan, saya akan pakai endpoint langsung.

        // STATE
        let currentPage = 'home';
        let currentAnimeId = null;
        let currentEpisodes = [];
        let currentEpisodeIndex = 0;
        let currentWatchId = null;

        // ============================================================
        //  FUNGSI FETCH DENGAN ERROR HANDLING
        // ============================================================
        async function fetchAPI(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.error('Fetch Error:', err);
                return null;
            }
        }

        function showLoader(show) {
            document.getElementById('globalLoader').style.display = show ? 'flex' : 'none';
        }

        // ============================================================
        //  NAVIGASI HALAMAN
        // ============================================================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            currentPage = pageId;
        }

        function goHome() {
            showPage('page-home');
            // Refresh data home kalau kosong
            if (document.getElementById('trendingGrid').children.length === 0) {
                loadHome();
            }
        }

        // ============================================================
        //  LOAD HOME (Trending & Recent)
        // ============================================================
        async function loadHome() {
            showLoader(true);
            const trendingGrid = document.getElementById('trendingGrid');
            const recentGrid = document.getElementById('recentGrid');
            trendingGrid.innerHTML = `<div class="loader"><i class="fas fa-spinner"></i></div>`;
            recentGrid.innerHTML = `<div class="loader"><i class="fas fa-spinner"></i></div>`;

            // Trending (top-airing)
            const trendingData = await fetchAPI(`${API_BASE}/anime/gogoanime/top-airing?page=1`);
            if (trendingData && trendingData.results) {
                trendingGrid.innerHTML = renderCards(trendingData.results.slice(0, 12));
            } else {
                trendingGrid.innerHTML =
                    `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Gagal memuat trending</p></div>`;
            }

            // Recent Episodes
            const recentData = await fetchAPI(`${API_BASE}/anime/gogoanime/recent-episodes?page=1`);
            if (recentData && recentData.results) {
                recentGrid.innerHTML = renderCards(recentData.results.slice(0, 12));
            } else {
                recentGrid.innerHTML =
                    `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Gagal memuat episode terbaru</p></div>`;
            }
            showLoader(false);
        }

        // ============================================================
        //  RENDER CARD GRID
        // ============================================================
        function renderCards(items) {
            if (!items || items.length === 0) {
                return `<div class="empty-state"><i class="fas fa-frown"></i><p>Anime tidak ditemukan</p></div>`;
            }
            return items.map(item => {
                const title = item.title || 'No Title';
                const img = item.image || 'https://via.placeholder.com/300x400/1e273a/7a849b?text=No+Image';
                const id = item.id || item.animeId || '';
                const ep = item.episodeNumber || item.episodes || '?';
                return `
                    <div class="anime-card" onclick="openDetail('${id}')">
                        <img src="${img}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400/1e273a/7a849b?text=Error'">
                        <div class="info">
                            <h3>${title}</h3>
                            <p>Episode ${ep}</p>
                            ${item.episodeNumber ? `<span class="ep-badge">EP ${item.episodeNumber}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        //  PENCARIAN
        // ============================================================
        async function searchAnime() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            showLoader(true);
            const data = await fetchAPI(`${API_BASE}/anime/gogoanime/search?query=${encodeURIComponent(query)}&page=1`);
            showLoader(false);

            // Tampilkan hasil di halaman Home (timpa trending)
            const grid = document.getElementById('trendingGrid');
            if (data && data.results) {
                grid.innerHTML = renderCards(data.results);
                document.querySelector('.section-title i').textContent = '🔍';
                document.querySelector('.section-title').innerHTML =
                    `<i class="fas fa-search"></i> Hasil pencarian: "${query}"`;
            } else {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Tidak ada hasil untuk "${query}"</p></div>`;
            }
            // Pastikan di home
            showPage('page-home');
        }

        // ============================================================
        //  OPEN DETAIL ANIME
        // ============================================================
        async function openDetail(animeId) {
            if (!animeId) return;
            showLoader(true);
            showPage('page-detail');

            const detailContainer = document.getElementById('detailContent');
            detailContainer.innerHTML = `<div class="loader"><i class="fas fa-spinner"></i></div>`;

            const data = await fetchAPI(`${API_BASE}/anime/gogoanime/info/${animeId}`);
            showLoader(false);

            if (!data || !data.title) {
                detailContainer.innerHTML =
                    `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Gagal memuat detail anime.</p><button class="back-btn" onclick="goHome()">Kembali</button></div>`;
                return;
            }

            currentAnimeId = animeId;
            currentEpisodes = data.episodes || [];
            currentEpisodeIndex = 0;
